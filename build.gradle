plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.115'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
    withJavadocJar()
}

// Machine-specific paths belong in this ignored file or -P options, never in source control.
def localDevelopment = new java.util.Properties()
def localDevelopmentFile = file('local-development.properties')
if (localDevelopmentFile.exists()) localDevelopmentFile.withInputStream { localDevelopment.load(it) }
def developmentProperty = { String key ->
    providers.gradleProperty(key).getOrElse(localDevelopment.getProperty(key, ''))
}
def dependencyJar = { String key ->
    def path = developmentProperty(key)
    path.isBlank() ? null : file(path)
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            def quickWorld = providers.gradleProperty('quickPlayWorld').getOrNull()
            if (quickWorld != null && !quickWorld.isBlank()) {
                programArgument '--quickPlaySingleplayer'
                programArgument quickWorld
            }
            def quickServer = providers.gradleProperty('quickPlayServer').getOrNull()
            if (quickServer != null && !quickServer.isBlank()) {
                programArgument '--quickPlayMultiplayer'
                programArgument quickServer
                programArgument '--username'
                programArgument providers.gradleProperty('testUsername').getOrElse('ProgTester')
            }
        }

        server {
            server()
            programArgument '--nogui'
        }

        phaseServer {
            server()
            gameDirectory = file('run/phase-server')
            programArgument '--nogui'
        }

        phaseClientA {
            client()
            gameDirectory = file('run/phase-client-a')
            programArgument '--username'
            programArgument 'PhaseA'
            programArgument '--uuid'
            programArgument '10000000-0000-0000-0000-00000000000a'
            programArgument '--quickPlayMultiplayer'
            programArgument '127.0.0.1:25575'
        }

        phaseClientB {
            client()
            gameDirectory = file('run/phase-client-b')
            programArgument '--username'
            programArgument 'PhaseB'
            programArgument '--uuid'
            programArgument '10000000-0000-0000-0000-00000000000b'
            programArgument '--quickPlayMultiplayer'
            programArgument '127.0.0.1:25575'
        }

        phaseClientC {
            client()
            gameDirectory = file('run/phase-client-c')
            programArgument '--username'
            programArgument 'PhaseC'
            programArgument '--uuid'
            programArgument '10000000-0000-0000-0000-00000000000c'
            programArgument '--quickPlayMultiplayer'
            programArgument '127.0.0.1:25575'
        }

        configureEach {
            logLevel = org.slf4j.event.Level.INFO
            // Isolated smoke-test worlds/clients; existing development saves remain untouched.
            def runDirectory = providers.gradleProperty('runDirectory').getOrNull()
            if (runDirectory != null) gameDirectory = file(runDirectory)
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    def localRepository = developmentProperty('localDependencyRepository')
    if (!localRepository.isBlank()) maven { url = uri(localRepository) }
    mavenCentral()
    maven { url = 'https://www.cursemaven.com' }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

def epicFightJar = dependencyJar('epicFightJar')
def betterLockOnJar = dependencyJar('betterLockOnJar')
def createJar = dependencyJar('createJar')
def bonfiresJar = dependencyJar('bonfiresJar')
def ironsSpellsJar = dependencyJar('ironsSpellsJar')
def ironsLibJar = dependencyJar('ironsLibJar')
def curiosJar = dependencyJar('curiosJar')
def geckoLibJar = dependencyJar('geckoLibJar')
def playerAnimatorJar = dependencyJar('playerAnimatorJar')
def shoulderSurfingJar = dependencyJar('shoulderSurfingJar')
def subtleEffectsJar = dependencyJar('subtleEffectsJar')
def fzzyConfigJar = dependencyJar('fzzyConfigJar')
def kotlinForForgeJar = dependencyJar('kotlinForForgeJar')
def presenceFootstepsJar = dependencyJar('presenceFootstepsJar')

dependencies {
    if (!epicFightJar?.exists()) {
        throw new GradleException("Epic Fight compile-only API JAR not found: ${epicFightJar}")
    }
    compileOnly files(epicFightJar)
    // Optional at runtime; the public camera plugin is discovered only by Shoulder Surfing itself.
    if (shoulderSurfingJar?.exists()) compileOnly files(shoulderSurfingJar)

    if (!ironsSpellsJar?.exists()) {
        throw new GradleException("Iron's Spells compile-only API JAR not found: ${ironsSpellsJar}")
    }
    compileOnly files(ironsSpellsJar)

    if (providers.gradleProperty('withEpicFight').map(String::toBoolean).getOrElse(false)) {
        if (!epicFightJar?.exists()) {
            throw new GradleException("Epic Fight runtime JAR not found: ${epicFightJar}")
        }
        localRuntime files(epicFightJar)
    }

    if (providers.gradleProperty('withIronsSpells').map(String::toBoolean).getOrElse(false)) {
        [ironsSpellsJar, ironsLibJar, curiosJar, geckoLibJar, playerAnimatorJar].each { runtimeJar ->
            if (!runtimeJar?.exists()) {
                throw new GradleException("Iron's Spells runtime dependency not found: ${runtimeJar}")
            }
        }
        localRuntime files(ironsSpellsJar, ironsLibJar, curiosJar, geckoLibJar, playerAnimatorJar)
    }

    if (providers.gradleProperty('withShoulderSurfing').map(String::toBoolean).getOrElse(false)) {
        if (!shoulderSurfingJar?.exists()) {
            throw new GradleException("Shoulder Surfing runtime JAR not found: ${shoulderSurfingJar}")
        }
        localRuntime files(shoulderSurfingJar)
    }

    if (providers.gradleProperty('withBetterLockOn').map(String::toBoolean).getOrElse(false)) {
        if (!betterLockOnJar?.exists()) {
            throw new GradleException("Better Lock On runtime JAR not found: ${betterLockOnJar}")
        }
        localRuntime files(betterLockOnJar)
    }

    if (providers.gradleProperty('withCreate').map(String::toBoolean).getOrElse(false)) {
        if (!createJar?.exists()) {
            throw new GradleException("Create runtime JAR not found: ${createJar}")
        }
        localRuntime files(createJar)
    }

    if (providers.gradleProperty('withBonfires').map(String::toBoolean).getOrElse(false)) {
        if (!bonfiresJar?.exists()) {
            throw new GradleException("Bonfires runtime JAR not found: ${bonfiresJar}")
        }
        localRuntime files(bonfiresJar)
    }

    if (providers.gradleProperty('withSubtleEffects').map(String::toBoolean).getOrElse(false)) {
        if (!subtleEffectsJar?.exists()) {
            throw new GradleException("SubtleEffects runtime JAR not found: ${subtleEffectsJar}")
        }
        if (!fzzyConfigJar?.exists()) {
            throw new GradleException("SubtleEffects test dependency Fzzy Config not found: ${fzzyConfigJar}")
        }
        if (!kotlinForForgeJar?.exists()) {
            throw new GradleException("SubtleEffects test dependency Kotlin for Forge not found: ${kotlinForForgeJar}")
        }
        localRuntime files(subtleEffectsJar, fzzyConfigJar, kotlinForForgeJar)
    }

    if (providers.gradleProperty('withPresenceFootsteps').map(String::toBoolean).getOrElse(false)) {
        if (!presenceFootstepsJar?.exists()) {
            throw new GradleException("Presence Footsteps runtime JAR not found: ${presenceFootstepsJar}")
        }
        localRuntime files(presenceFootstepsJar)
    }

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            neo_version_range       : neo_version_range,
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            mod_description         : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs.add('-Xlint:deprecation')
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

// Compile the supported integration example without packaging it into the mod.
sourceSets.create('integrationExamples')
sourceSets.integrationExamples.java.srcDir 'docs/integration/examples'
sourceSets.integrationExamples.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
tasks.named('check').configure { dependsOn tasks.named('compileIntegrationExamplesJava') }

// Opt-in server regression fixture. Never included in the distribution JAR.
if (providers.gradleProperty('weaponRegression').map(String::toBoolean).getOrElse(false)) {
    sourceSets.create('weaponRegression')
    sourceSets.weaponRegression.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    sourceSets.weaponRegression.runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    neoForge.mods {
        weaponregression { sourceSet sourceSets.weaponRegression }
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Version' : mod_version,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.version
        ])
    }
}

tasks.named('javadoc').configure {
    // Only the supported facade is an integration contract; do not publish internal Javadoc.
    source = fileTree('src/main/java') { include 'dev/maplesadventure/api/**/*.java' }
    classpath = sourceSets.main.compileClasspath + sourceSets.main.output
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:all,-missing', '-quiet')
}

publishing {
    publications {
        mavenJava(org.gradle.api.publish.maven.MavenPublication) {
            from components.java
            artifactId = mod_id
            pom {
                name = mod_name
                description = 'Souls-like adventure, combat and server-authoritative integration API for NeoForge.'
                url = 'https://github.com/Axira-A/MaplesAdventure'
                licenses {
                    license {
                        name = 'MIT License (source code only; visual assets excluded)'
                        url = 'https://github.com/Axira-A/MaplesAdventure/blob/main/ASSET_LICENSE.md'
                        distribution = 'repo'
                    }
                }
                developers { developer { id = 'Axira'; name = 'Axira' } }
                scm { url = 'https://github.com/Axira-A/MaplesAdventure' }
            }
        }
    }
    // No hosted repository or credentials. Use publishToMavenLocal until hosting is available.
}
